name: SRE Agent Swarm CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  static-analysis:
    name: Lint & Static Syntax Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Static Syntax Verification
        run: |
          python -m py_compile cli.py
          python -m py_compile core/*.py
          python -m py_compile agents/*.py
          python -m py_compile chaos/*.py
          python -m py_compile telemetry/*.py
          python -m py_compile tools/*.py
          python -m py_compile api/*.py
          python -m py_compile tests/*.py

  backend-tests:
    name: Backend Pytest Suite (Coverage >= 85%)
    runs-on: ubuntu-latest
    needs: [ static-analysis ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Deterministic Pytest Suite with Coverage
        run: |
          pytest -v --cov=core --cov=agents --cov=tools --cov=api --cov=chaos --cov=telemetry --cov=cli --cov-report=term-missing --cov-report=xml --cov-fail-under=85

  frontend-build:
    name: Frontend React Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm install

      - name: Build Frontend Production Assets
        working-directory: frontend
        run: |
          npm run build
